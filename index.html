<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>元丰科技 · 简洁官网</title>
  <meta name="description" content="元丰科技静态官网页面，包含首页、特色、关于、联系等基础板块">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' fill='%23005bff'/%3E%3Ctext x='50' y='58' font-size='52' text-anchor='middle' fill='white' font-family='Verdana'%3EYF%3C/text%3E%3C/svg%3E">
  <style>
    :root { --bg: #0f172a; --text: #0b1220; --muted: #475569; --primary: #2563eb; --primary-600: #1d4ed8; --surface: #ffffff; --surface-2: #f1f5f9; --accent: #0ea5e9; }
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", Arial, sans-serif; color: var(--text); background: #fff; }
    a { color: inherit; text-decoration: none; }
    img { max-width: 100%; display: block; }
    .container { width: 100%; max-width: 1080px; margin: 0 auto; padding: 0 20px; }
    .site-header { position: sticky; top: 0; z-index: 10; background: rgba(255,255,255,.85); backdrop-filter: saturate(180%) blur(6px); border-bottom: 1px solid #e5e7eb; }
    .site-header .wrap { display: flex; align-items: center; justify-content: space-between; height: 64px; }
    .logo { font-weight: 700; letter-spacing: .5px; color: var(--primary); font-size: 18px; }
    .nav { display: flex; gap: 20px; }
    .nav a { padding: 8px 10px; border-radius: 8px; color: #0f172a; }
    .nav a:hover { background: var(--surface-2); }
    .hero { background: linear-gradient(180deg, #e6f0ff 0%, #ffffff 100%); }
    .hero .wrap { display: grid; grid-template-columns: 1.2fr .8fr; gap: 24px; align-items: center; padding: 64px 0; }
    .hero h1 { margin: 0 0 12px; font-size: clamp(28px, 4vw, 42px); line-height: 1.15; color: #0b1220; }
    .hero p { margin: 0 0 20px; font-size: 16px; color: var(--muted); }
    .actions { display: flex; gap: 12px; }
    .btn { display: inline-flex; align-items: center; justify-content: center; height: 44px; padding: 0 18px; border-radius: 10px; font-weight: 600; border: 1px solid transparent; transition: all .2s ease; }
    .btn.primary { background: var(--primary); color: #fff; }
    .btn.primary:hover { background: var(--primary-600); }
    .btn.ghost { border-color: #cbd5e1; color: #0f172a; background: #fff; }
    .btn.ghost:hover { border-color: #94a3b8; background: #f8fafc; }
    .hero .media { aspect-ratio: 4/3; border-radius: 16px; background: #fff; border: 1px solid #e5e7eb; box-shadow: 0 8px 30px rgba(2, 6, 23, .06); display: grid; place-items: center; color: var(--muted); font-size: 14px; }
    .section { padding: 56px 0; }
    .section h2 { margin: 0 0 16px; font-size: clamp(22px, 3vw, 28px); }
    .section .sub { margin: 0 0 28px; color: var(--muted); }
    .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; }
    .card { background: #fff; border: 1px solid #e5e7eb; border-radius: 14px; padding: 18px; box-shadow: 0 6px 20px rgba(2, 6, 23, .04); }
    .card h3 { margin: 0 0 8px; font-size: 18px; }
    .card p { margin: 0; color: var(--muted); font-size: 14px; }
    .about .content { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
    .contact .wrap { display: grid; grid-template-columns: 1.1fr .9fr; gap: 24px; }
    .contact-form { display: grid; gap: 12px; }
    .row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    input, textarea { width: 100%; padding: 12px 14px; border: 1px solid #cbd5e1; border-radius: 10px; font-size: 14px; outline: none; }
    input:focus, textarea:focus { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(37, 99, 235, .15); }
    .info { display: grid; gap: 6px; color: var(--muted); }
    .site-footer { border-top: 1px solid #e5e7eb; padding: 20px 0; background: #fff; }
    .site-footer .wrap { display: flex; align-items: center; justify-content: space-between; }
    .social { display: flex; gap: 12px; }
    @media (max-width: 920px) {
      .hero .wrap { grid-template-columns: 1fr; }
      .about .content, .contact .wrap { grid-template-columns: 1fr; }
      .grid { grid-template-columns: 1fr 1fr; }
      .row { grid-template-columns: 1fr; }
    }
    @media (max-width: 560px) {
      .grid { grid-template-columns: 1fr; }
    }
  </style>
  <meta name="theme-color" content="#2563eb">
</head>
<body>
  <header class="site-header">
    <div class="container wrap">
      <div class="logo">元丰科技</div>
      <nav class="nav">
        <a href="#home">首页</a>
        <a href="#features">产品特色</a>
        <a href="#about">关于我们</a>
      </nav>
    </div>
  </header>

  <main id="home">
    <section class="hero">
      <div class="container wrap">
        <div style="padding: 0 30px;">
          <h1>让科技更简单</h1>
          <p>面向企业的轻量化解决方案，稳定、易用、可扩展。</p>
          <div class="actions">
            <a class="btn primary" href="#contact">立即咨询</a>
            <a class="btn ghost" href="#features">了解更多</a>
          </div>
        </div>
        <!-- <div class="media">产品示意图占位</div> -->
      </div>
    </section>

    <section id="features" class="section">
      <div class="container">
        <h2>产品特色</h2>
        <p class="sub">为不同业务场景提供稳定可靠的能力</p>
        <div class="grid">
          <div class="card">
            <h3>稳定可靠</h3>
            <p>高可用架构设计，保障关键业务持续在线。</p>
          </div>
          <div class="card">
            <h3>易于集成</h3>
            <p>开放接口与标准协议，快速对接现有系统。</p>
          </div>
          <div class="card">
            <h3>安全合规</h3>
            <p>遵循行业标准与最佳实践，守护数据安全。</p>
          </div>
        </div>
      </div>
    </section>

    <section id="about" class="section about">
      <div class="container">
        <h2>关于我们</h2>
        <div class="content">
          <p>我们专注于为企业构建简单而强大的技术产品，以务实的工程能力与贴近业务的理解，持续为客户创造长期价值。</p>
          <p>愿景是让每一家企业都能轻松拥抱现代化技术栈，提升效率、降低成本并加速创新。</p>
        </div>
      </div>
    </section>

    
  </main>

  <footer class="site-footer">
    <div class="container wrap">
      <div>© 2026 元丰科技</div>
      <div class="social">
        <!-- <a href="#">WeChat</a>
        <a href="#">Weibo</a> -->
      </div>
    </div>
  </footer>
</body>
</html>
